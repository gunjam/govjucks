name: Node.js CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24, 26]
        include:
        - os: windows-latest
          node_version: 22
        - os: windows-latest
          # use 24.15 to workaround https://github.com/nodejs/node/issues/63638
          node_version: 24.15.0

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - env:
          TMP_DIR: ${{ runner.temp }}
        run: npm test
      - run: npm run lint

        env:
          CI: true
